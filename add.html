<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Production Data</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Add Daily Data</h1>
  </header>

  <main>
    <form id="dataForm">
      <label>Work Date: <input type="date" name="workDate"></label><br>
      <label>CO-186: <input type="number" name="co186"></label><br>
      <label>CO-252: <input type="number" name="co252"></label><br>
      <label>210: <input type="number" name="c210"></label><br>
      <label>18626: <input type="number" name="c18626"></label><br>
      <label>ANTHEM: <input type="number" name="anthem"></label><br>
      <label>HUMANA: <input type="number" name="humana"></label><br>
      <label>UHC: <input type="number" name="uhc"></label><br>
      <label>ROI: <input type="number" name="roi"></label><br>
      <label>TOTAL: <input type="number" name="total"></label><br>
      <label>STATUS: <input type="text" name="status"></label><br>
      <label>PERCENT: <input type="number" name="percent"></label><br>
      <button type="submit">Save</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
